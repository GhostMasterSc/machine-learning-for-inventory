services:
  inventory-app:
    build: .
    restart: always
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - mlruns_data:/app/mlruns
    environment:
      - PYTHONPATH=/app
      - CONDA_DEFAULT_ENV=inventory-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  tests:
    build: .
    volumes:
      - .:/app
      - mlruns_data:/app/mlruns
    environment:
      - PYTHONPATH=/app
      - TESTING=true
      - CONDA_DEFAULT_ENV=inventory-env
    command: conda run --no-capture-output -n inventory-env python run_tests.py

# mlruns_data is a Docker-managed named volume, so MLflow experiment history
# persists across runs without depending on a host directory. To run on an
# NVIDIA GPU, add a `deploy.resources.reservations.devices` block requesting
# the gpu capability to a service (requires the NVIDIA Container Toolkit).
volumes:
  mlruns_data:
